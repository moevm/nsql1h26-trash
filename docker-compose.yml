services:
  db:
    image: arangodb:3.11
    container_name: trash_db
    environment:
      ARANGO_NO_AUTH: "1"
    volumes:
      - arango_data:/var/lib/arangodb3
    networks:
      - trash_net
    healthcheck:
      test: [ "CMD-SHELL", "arangosh --server.endpoint tcp://127.0.0.1:8529 --javascript.execute-string 'db._version()' >/dev/null 2>&1 || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trash_backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TRASH_DB_HOST: db
      TRASH_DB_PORT: "8529"
      TRASH_DB_URL: http://db:8529
      TRASH_DB_NAME: trash_db
      TRASH_DB_PASSWORD: ""
      TRASH_SEED_DEMO_DATA: "true"
      # Установить true для запуска бенчмарка при старте (3 масштаба данных)
      TRASH_RUN_BENCHMARK: "true"
    volumes:
      - benchmark_results:/app/benchmark_results
    depends_on:
      db:
        condition: service_healthy
    networks:
      - trash_net
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)" ]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 300s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trash_frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - trash_net

networks:
  trash_net:
    driver: bridge

volumes:
  arango_data:
  benchmark_results:
